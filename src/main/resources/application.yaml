
spring:
  application:
    name: CinebookV2

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  security:
    jwt:
      issuer: cinebook-api
      secret: ${JWT_SECRET}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 2592000
