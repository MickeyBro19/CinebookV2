
name: cinebook-ci

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cinebookv2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 0000
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cinebookv2"
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/cinebookv2
      DB_USER: postgres
      DB_PASS: 0000
      JWT_SECRET: Y/KF+hjpwMSbEh/Hb5Vg3FuHx85qG0pb2tJfDeASgKM=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant Maven Wrapper permission
        run: chmod +x mvnw

      - name: Run Maven verification
        run: ./mvnw --batch-mode clean verify
