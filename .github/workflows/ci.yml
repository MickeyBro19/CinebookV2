
name: cinebook-ci

on:
  push:
    branches:
      - master
      - main
      - develop

  pull_request:
    branches:
      - master
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    env:
      DB_URL: jdbc:postgresql://localhost:5432/cinebook_flyway_test
      DB_USER: postgres
      DB_PASS: 0000
      JWT_SECRET: Y/KF+hjpwMSbEh/Hb5Vg3FuHx85qG0pb2tJfDeASgKM=

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Grant Maven Wrapper permission
        run: chmod +x mvnw

      - name: Run Maven verification
        run: ./mvnw --batch-mode clean verify
